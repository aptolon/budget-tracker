services:
  bt-postgres:
    image: postgres:18.4-bookworm
    container_name: budget-tracker-env-postgres
    environment: 
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always


  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: budget-tracker-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:bt-postgres:${POSTGRES_PORT}
    ports:
      - "127.0.0.1:5432:5432"
  bt-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
    - ${PROJECT_ROOT}/migrations:/migrations